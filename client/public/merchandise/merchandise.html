<!-- Merchandise section HTML template -->
<section id="merchandise" class="merchandise-section">
  <div class="merchandise-container">
    <div class="merchandise-header">
      <h2 class="merchandise-title">Conference Merchandise</h2>
      <p class="merchandise-subtitle">
        Show your support for the Vibe Coding Conference with our exclusive merchandise.
        Pre-order now and pick up your items at the conference!
      </p>
    </div>
    
    <div class="merchandise-tabs">
      <button class="merchandise-tab active" data-category="all">All Items</button>
      <button class="merchandise-tab" data-category="tshirt">T-Shirts</button>
      <button class="merchandise-tab" data-category="hat">Hats</button>
    </div>
    
    <div id="merchandise-loading" class="merchandise-loading">
      <div class="spinner"></div>
    </div>
    
    <div id="merchandise-error" class="merchandise-error">
      Error loading merchandise. Please try again later.
    </div>
    
    <div id="merchandise-grid" class="merchandise-grid">
      <!-- Merchandise cards will be rendered here by JavaScript -->
    </div>
  </div>
</section>
